name: Daily data update

on:
  schedule:
    # 22:00 UTC Mon–Fri ≈ 06:00 Asia/Shanghai Tue–Sat — runs after each US
    # trading day's close. Sat/Sun are skipped: no new market data anyway.
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Fetch, build, commit
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if ! python fetch.py; then
            echo "::warning::fetch.py (Koyfin) failed — skipping refresh this run."
            exit 0
          fi
          python commentary.py || echo "::warning::commentary step failed — page falls back to static copy."
          python build_html.py
          python alerts.py
          git add -A data/ index.html
          if git diff --cached --quiet; then
            echo "No data changes today."
            exit 0
          fi
          git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
          git push
