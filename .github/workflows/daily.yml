name: Daily data update

on:
  schedule:
    # 03:30 UTC Tue–Sat ≈ 11:30 Asia/Shanghai, after each US trading day.
    # Cboe rewrites VIX_History.csv around 02:10 UTC, hours after VIX3M, VIX9D
    # and VIX6M (about 22:30 UTC), so an earlier run gets a VIX a day behind.
    - cron: "30 3 * * 2-6"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Production scripts are stdlib-only; requirements.txt is for local runs.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch, build, commit
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          if ! python fetch.py; then
            echo "::warning::fetch.py crashed — skipping refresh this run."
            exit 0
          fi
          python -m unittest discover -s tests
          python commentary.py || echo "::warning::commentary step failed — section 01 keeps the previous findings or none."
          python build_html.py
          python vix_signals.py
          python alerts.py
          git add -A data/ index.html
          if git diff --cached --quiet; then
            echo "No data changes today."
            exit 0
          fi
          git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
          git push
